    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        /* --- 案前香火特效 --- */
        .incense-smoke {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.25;
            z-index: 10;
            mix-blend-mode: screen;
            overflow: hidden;
        }

        .smoke-layer {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.8) 0%, transparent 60%);
            filter: blur(40px);
            animation: smokeFloat 15s infinite ease-in-out;
        }

        .smoke-layer:nth-child(2) {
            animation-delay: -5s;
            left: 10%;
            scale: 1.2;
            opacity: 0.6;
        }

        .smoke-layer:nth-child(3) {
            animation-delay: -10s;
            left: -5%;
            scale: 0.8;
            opacity: 0.4;
        }

        @keyframes smokeFloat {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 0.2;
            }

            33% {
                transform: translate(-2%, -10%) scale(1.1) rotate(5deg);
                opacity: 0.5;
            }

            66% {
                transform: translate(2%, -20%) scale(0.9) rotate(-5deg);
                opacity: 0.3;
            }

            100% {
                transform: translate(0, -30%) scale(1) rotate(0deg);
                opacity: 0;
            }
        }

        .energy-ring {
            width: 120px;
            height: 120px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 天機翻牌特效 --- */
        .flip-card-container {
            perspective: 1000px;
            position: relative;
        }

        .flip-card {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipping {
            animation: flipTick 0.6s ease-in-out;
        }

        .flip-card.flipping-jieqi {
            animation: flipTickJieQi 0.8s ease-in-out;
        }

        @keyframes flipTick {
            0% {
                transform: rotateX(0deg);
            }

            50% {
                transform: rotateX(-90deg);
            }

            100% {
                transform: rotateX(0deg);
            }
        }

        
        /* --- 紫微四化飛星高階動態光流與能量脈衝 --- */
        @keyframes flyingStreamFlow {
            0% {
                stroke-dashoffset: 48;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes flyingPulseGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 4px currentColor);
            }
            50% {
                transform: scale(1.18);
                filter: drop-shadow(0 0 14px currentColor);
            }
        }

        @keyframes rotateSelfTrans {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .flying-stream-lu {
            stroke-dasharray: 8, 4;
            animation: flyingStreamFlow 1.2s linear infinite;
            filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.8));
        }

        .flying-stream-quan {
            stroke-dasharray: 8, 4;
            animation: flyingStreamFlow 1.2s linear infinite;
            filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.8));
        }

        .flying-stream-ke {
            stroke-dasharray: 8, 4;
            animation: flyingStreamFlow 1.2s linear infinite;
            filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.8));
        }

        .flying-stream-ji {
            stroke-dasharray: 8, 4;
            animation: flyingStreamFlow 1.2s linear infinite;
            filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.8));
        }

        /* --- 真實 3D 擲筊物理拋擲與落地彈跳動畫 --- */
        @keyframes realPoeTossLeft {
            0% {
                transform: translateY(0) scale(1) rotate(0deg) rotateX(0deg);
                filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            }
            20% {
                transform: translateY(-130px) translateX(-35px) scale(1.3) rotateX(360deg) rotateY(180deg) rotate(-45deg);
                filter: drop-shadow(0 25px 25px rgba(0,0,0,0.2));
            }
            45% {
                transform: translateY(-90px) translateX(-20px) scale(1.15) rotateX(720deg) rotateY(360deg) rotate(90deg);
                filter: drop-shadow(0 15px 15px rgba(0,0,0,0.3));
            }
            70% {
                transform: translateY(12px) translateX(-5px) scale(0.92) rotateX(990deg) rotateY(520deg) rotate(160deg);
                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            }
            85% {
                transform: translateY(-10px) translateX(-2px) scale(1.03) rotateX(1060deg) rotateY(535deg) rotate(175deg);
                filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5));
            }
            100% {
                transform: translateY(0) scale(1) rotateX(1080deg) rotateY(540deg) rotate(180deg);
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
            }
        }

        @keyframes realPoeTossRight {
            0% {
                transform: translateY(0) scale(1) rotate(0deg) rotateX(0deg);
                filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            }
            20% {
                transform: translateY(-140px) translateX(40px) scale(1.35) rotateX(-360deg) rotateY(-200deg) rotate(45deg);
                filter: drop-shadow(0 25px 25px rgba(0,0,0,0.2));
            }
            45% {
                transform: translateY(-85px) translateX(25px) scale(1.15) rotateX(-720deg) rotateY(-380deg) rotate(-90deg);
                filter: drop-shadow(0 15px 15px rgba(0,0,0,0.3));
            }
            70% {
                transform: translateY(14px) translateX(8px) scale(0.92) rotateX(-990deg) rotateY(-510deg) rotate(-150deg);
                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            }
            85% {
                transform: translateY(-8px) translateX(3px) scale(1.03) rotateX(-1060deg) rotateY(-530deg) rotate(-165deg);
                filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5));
            }
            100% {
                transform: translateY(0) scale(1) rotateX(-1080deg) rotateY(-540deg) rotate(-170deg);
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
            }
        }

        .animate-poe-toss-left {
            animation: realPoeTossLeft 1.1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .animate-poe-toss-right {
            animation: realPoeTossRight 1.15s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- 籤筒搖動與銅錢翻轉特效 --- */
        @keyframes bambooContainerShake {
            0% { transform: rotate(0deg) translateY(0); }
            15% { transform: rotate(-12deg) translateY(-8px); }
            30% { transform: rotate(14deg) translateY(4px); }
            45% { transform: rotate(-10deg) translateY(-6px); }
            60% { transform: rotate(12deg) translateY(2px); }
            75% { transform: rotate(-8deg) translateY(-4px); }
            90% { transform: rotate(6deg) translateY(1px); }
            100% { transform: rotate(0deg) translateY(0); }
        }

        @keyframes coinToss3D {
            0% { transform: translateY(0) rotateY(0deg) rotateX(0deg) scale(1); }
            30% { transform: translateY(-80px) rotateY(540deg) rotateX(360deg) scale(1.3); }
            70% { transform: translateY(10px) rotateY(1080deg) rotateX(720deg) scale(0.95); }
            85% { transform: translateY(-6px) rotateY(1170deg) rotateX(780deg) scale(1.02); }
            100% { transform: translateY(0) rotateY(1260deg) rotateX(840deg) scale(1); }
        }

        .animate-lot-shake {
            animation: bambooContainerShake 0.7s ease-in-out infinite;
        }

        .animate-coin-spin {
            animation: coinToss3D 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes flipTickJieQi {
            0% {
                transform: rotateX(0deg);
                scale: 1;
            }

            50% {
                transform: rotateX(-90deg);
                scale: 1.05;
            }

            100% {
                transform: rotateX(0deg);
                scale: 1;
            }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .energy-vibration {
            position: absolute;
            inset: 0;
            border: 4px solid currentcolor;
            border-radius: 50%;
            animation: vibrate 4s infinite linear;
            opacity: 0.3;
        }

        @keyframes vibrate {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(139, 69, 19, 0.3);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 69, 19, 0.5);
        }

        /* --- 宗師靈光 (Master Resonance) --- */
        .breathing-avatar {
            animation: masterBreathe 3s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }

        @keyframes masterBreathe {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 40px rgba(99, 102, 241, 0.6);
            }
        }

        .resonance-ring {
            position: absolute;
            inset: -10px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            animation: resonancePulse 2s infinite;
        }

        @keyframes resonancePulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* --- 八卦推演 (Bagua Loading) --- */
        .bagua-spinner {
            width: 40px;
            height: 40px;
            border: 3px double var(--destiny-primary);
            border-radius: 50%;
            position: relative;
            animation: baguaRotate 8s infinite linear;
        }

        .bagua-spinner::before {
            content: "☯";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--destiny-primary);
        }

        @keyframes baguaRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* --- 命定色調控制 --- */
        :root {
            --destiny-primary: #4f46e5;
            --aura-color: #f8fafc;
            --aura-gradient: radial-gradient(circle at top, #f8fafc 0%, #eef2ff 100%);
        }

        .aura-fire {
            --destiny-primary: #e11d48;
            --aura-color: #fff1f2;
            --aura-gradient: radial-gradient(circle at top, #fff1f2 0%, #ffe4e6 100%);
        }

        .aura-water {
            --destiny-primary: #0284c7;
            --aura-color: #f0f9ff;
            --aura-gradient: radial-gradient(circle at top, #f0f9ff 0%, #e0f2fe 100%);
        }

        .aura-wood {
            --destiny-primary: #16a34a;
            --aura-color: #f0fdf4;
            --aura-gradient: radial-gradient(circle at top, #f0fdf4 0%, #dcfce7 100%);
        }

        .aura-gold {
            --destiny-primary: #ca8a04;
            --aura-color: #fefce8;
            --aura-gradient: radial-gradient(circle at top, #fefce8 0%, #fef9c3 100%);
        }

        .aura-earth {
            --destiny-primary: #92400e;
            --aura-color: #fffbeb;
            --aura-gradient: radial-gradient(circle at top, #fffbeb 0%, #fef3c7 100%);
        }


        /* --- 互動星曜 (Interactive Stars) --- */
        .star-interactive {
            cursor: help;
            transition: all 0.3s;
            position: relative;
        }

        .star-interactive:hover {
            filter: drop-shadow(0 0 5px var(--destiny-primary));
            transform: scale(1.1);
        }

        .star-tooltip {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, 5px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @media (max-width: 768px) {
            .star-tooltip {
                position: fixed;
                bottom: 20px;
                left: 20px;
                right: 20px;
                transform: none;
                white-space: normal;
                text-align: center;
                background: rgba(15, 23, 42, 0.98);
                padding: 15px;
                font-size: 14px;
                line-height: 1.6;
            }
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .print-font {
            font-family: 'Noto Serif TC', serif;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .print-border {
                border: 4px solid #000 !important;
            }

            .print-shadow-none {
                box-shadow: none !important;
            }

            .print-full-width {
                width: 100% !important;
            }
        }

        .star-main {
            color: #312e81;
            font-weight: 900;
            font-size: 1.1rem;
        }

        .star-malefic {
            color: #dc2626;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .star-auspicious {
            color: #15803d;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .star-minor {
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .star-mini {
            color: #94a3b8;
            font-size: 0.65rem;
            transform: scale(0.9);
            display: inline-block;
            margin-right: 1px;
        }

        /* --- 數位靈符 (Digital Talisman) --- */
        .talisman-paper {
            background: #fedc00;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 60%),
                url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            width: 320px;
            min-height: 560px;
            border: 4px solid #cc0000;
            padding: 40px 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3), inset 0 0 100px rgba(204, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Noto Serif TC', serif;
            color: #cc0000;
        }

        .talisman-header {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.5rem;
            border-bottom: 2px solid #cc0000;
            margin-bottom: 30px;
            width: 100%;
            text-align: center;
        }

        .talisman-content {
            writing-mode: vertical-rl;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.2rem;
            line-height: 2;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .talisman-seal {
            border: 3px solid #cc0000;
            padding: 5px;
            font-size: 1.2rem;
            font-weight: 900;
            margin-top: 20px;
            transform: rotate(-10deg);
        }

        .talisman-glow {
            animation: talismanGlow 3s infinite alternate;
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 12s linear infinite;
        }

        .star-sihua {
            background-color: #fef3c7;
            color: #d97706;
            padding: 0 2px;
            border-radius: 2px;
            margin-left: 2px;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .star-lucun {
            background-color: #dcfce7;
            color: #166534;
            padding: 0 2px;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* SVG 線條動畫 */
        .line-animate {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 1.5s ease-out forwards;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }

        .palace-hover {
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, box-shadow;
        }

        .palace-hover:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px -4px rgba(79, 70, 229, 0.18), 0 0 0 1.5px rgba(99, 102, 241, 0.35);
            background-color: #ffffff;
            cursor: pointer;
            z-index: 25;
        }

        .palace-focused {
            background-color: #ffffff !important;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 30px -4px rgba(79, 70, 229, 0.28), 0 0 0 2.5px #4f46e5 !important;
            z-index: 30;
            animation: focusedPalaceGlow 2.5s infinite alternate ease-in-out;
        }

        @keyframes focusedPalaceGlow {
            0% {
                box-shadow: 0 12px 24px -4px rgba(79, 70, 229, 0.25), 0 0 0 2.5px #4f46e5;
            }
            100% {
                box-shadow: 0 18px 36px -4px rgba(79, 70, 229, 0.4), 0 0 12px rgba(79, 70, 229, 0.5), 0 0 0 3px #6366f1;
            }
        }

        .palace-resonant-opposite {
            box-shadow: 0 8px 20px -3px rgba(239, 68, 68, 0.25), 0 0 0 2px #ef4444 !important;
            animation: oppositePulse 2s infinite ease-in-out;
            z-index: 22;
        }

        @keyframes oppositePulse {
            0%, 100% { box-shadow: 0 8px 20px -3px rgba(239, 68, 68, 0.2), 0 0 0 2px #ef4444; }
            50% { box-shadow: 0 12px 24px -2px rgba(239, 68, 68, 0.35), 0 0 8px rgba(239, 68, 68, 0.4), 0 0 0 2.5px #f87171; }
        }

        .palace-resonant-triangular {
            box-shadow: 0 8px 20px -3px rgba(59, 130, 246, 0.25), 0 0 0 2px #3b82f6 !important;
            animation: triPulse 2.2s infinite ease-in-out;
            z-index: 22;
        }

        @keyframes triPulse {
            0%, 100% { box-shadow: 0 8px 20px -3px rgba(59, 130, 246, 0.2), 0 0 0 2px #3b82f6; }
            50% { box-shadow: 0 12px 24px -2px rgba(59, 130, 246, 0.35), 0 0 8px rgba(59, 130, 246, 0.4), 0 0 0 2.5px #60a5fa; }
        }

        .palace-resonant-clamp {
            box-shadow: 0 6px 16px -3px rgba(245, 158, 11, 0.2), 0 0 0 1.5px #f59e0b !important;
            z-index: 21;
        }

        /* --- 宗師大師諮詢動效 (Master Consultation Interactive Ritual) --- */
        .master-consult-button {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 50%, #6366f1 100%);
            box-shadow: 0 10px 25px -3px rgba(79, 70, 229, 0.4), 0 0 15px rgba(99, 102, 241, 0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .master-consult-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 70%
            );
            transform: rotate(25deg);
            animation: shimmerSweep 3.5s infinite;
        }

        @keyframes shimmerSweep {
            0% { transform: translateX(-100%) rotate(25deg); }

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useLayoutEffect } = React;


        const apiKey = "";

        // --- 完整紫微心法全書內容 (已恢復) ---
        // --- 完整紫微心法全書內容 (已移至後端保護) ---
        const MASTER_BOOK = ""; // 內容已在後端注入，前端無需保留

        const STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        const TIME_RANGES = ["23-01", "01-03", "03-05", "05-07", "07-09", "09-11", "11-13", "13-15", "15-17", "17-19", "19-21", "21-23"];
        const ZODIAC = ["鼠", "牛", "虎", "兔", "龍", "蛇", "馬", "羊", "猴", "雞", "狗", "豬"];
        const PALACES = ["命宮", "兄弟宮", "夫妻宮", "子女宮", "財帛宮", "疾厄宮", "遷移宮", "奴僕宮", "官祿宮", "田宅宮", "福德宮", "父母宮"];

        // --- 星曜資料庫 ---
        // ... (保留星曜資料庫不變) ...
        const CHANG_SHENG_12 = ["長生", "沐浴", "冠帶", "臨官", "帝旺", "衰", "病", "死", "墓", "絕", "胎", "養"];
        // ... (保留其他常數定義) ...
        const TAI_SUI_12 = ["太歲", "晦氣", "喪門", "貫索", "官符", "小耗", "歲破", "龍德", "白虎", "天德", "吊客", "病符"];
        const JIANG_QIAN_12 = ["將星", "攀鞍", "歲驛", "息神", "華蓋", "劫煞", "災煞", "天煞", "指背", "咸池", "月煞", "亡神"];
        const SI_HUA_TABLE = {
            '甲': { lu: '廉貞', quan: '破軍', ke: '武曲', ji: '太陽' },
            '乙': { lu: '天機', quan: '天梁', ke: '紫微', ji: '太陰' },
            '丙': { lu: '天同', quan: '天機', ke: '文昌', ji: '廉貞' },
            '丁': { lu: '太陰', quan: '天同', ke: '天機', ji: '巨門' },
            '戊': { lu: '貪狼', quan: '太陰', ke: '右弼', ji: '天機' },
            '己': { lu: '武曲', quan: '貪狼', ke: '天梁', ji: '文曲' },
            '庚': { lu: '太陽', quan: '武曲', ke: '太陰', ji: '天同' },
            '辛': { lu: '巨門', quan: '太陽', ke: '文曲', ji: '文昌' },
            '壬': { lu: '天梁', quan: '紫微', ke: '左輔', ji: '武曲' },
            '癸': { lu: '破軍', quan: '巨門', ke: '太陰', ji: '貪狼' }
        };

                const FlyingStarOverlay = ({ focusedId, chartData }) => {
            const [lines, setLines] = React.useState([]);

            React.useLayoutEffect(() => {
                if (focusedId === null || focusedId === -1 || !chartData) {
                    setLines([]);
                    return;
                }

                const container = document.getElementById('chart-grid-container');
                if (!container) return;
                const containerRect = container.getBoundingClientRect();

                const getCenter = (id) => {
                    const el = document.getElementById(`palace-${id}`);
                    if (!el) return null;
                    const rect = el.getBoundingClientRect();
                    return {
                        x: rect.left + rect.width / 2 - containerRect.left,
                        y: rect.top + rect.height / 2 - containerRect.top
                    };
                };

                const sourcePalace = chartData.find(c => c.id === focusedId);
                if (!sourcePalace) return;

                const stem = sourcePalace.gan;
                const trans = SI_HUA_TABLE[stem];
                if (!trans) return;

                const findPalaceId = (starName) => chartData.find(c => c.stars.some(s => (typeof s === 'string' ? s : s.name).indexOf(starName) > -1))?.id;

                const getStarPosition = (palaceId, starName) => {
                    const palaceEl = document.getElementById(`palace-${palaceId}`);
                    if (!palaceEl) return null;

                    const starSpans = Array.from(palaceEl.querySelectorAll('span'));
                    const targetSpan = starSpans.find(s => s.textContent.trim() === starName);

                    if (!targetSpan) return null;

                    const rect = targetSpan.getBoundingClientRect();
                    return {
                        x: rect.left + rect.width / 2 - containerRect.left,
                        y: rect.top + rect.height / 2 - containerRect.top
                    };
                };

                const newLines = [];
                const addLine = (type, star, color, streamClass, badgeBg) => {
                    const targetId = findPalaceId(star);
                    if (targetId !== undefined && targetId !== -1) {
                        const start = getCenter(focusedId);
                        let end = getStarPosition(targetId, star);
                        if (!end) {
                            end = getCenter(targetId);
                        }

                        if (start && end) {
                            newLines.push({ type, star, color, streamClass, badgeBg, start, end, isSelf: focusedId === targetId, targetId });
                        }
                    }
                };

                addLine('祿', trans.lu, '#10b981', 'flying-stream-lu', 'bg-emerald-500');
                addLine('權', trans.quan, '#ef4444', 'flying-stream-quan', 'bg-red-500');
                addLine('科', trans.ke, '#a855f7', 'flying-stream-ke', 'bg-purple-500');
                addLine('忌', trans.ji, '#3b82f6', 'flying-stream-ji', 'bg-blue-500');

                setLines(newLines);
            }, [focusedId, chartData]);

            if (lines.length === 0) return null;

            return (
                <svg className="absolute inset-0 w-full h-full pointer-events-none z-50" style={{ overflow: 'visible' }}>
                    <defs>
                        {['#10b981', '#ef4444', '#a855f7', '#3b82f6'].map(c => (
                            <marker key={c} id={`arrow-${c.replace('#', '')}`} markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
                                <polygon points="0 0, 12 4.5, 0 9" fill={c} style={{ filter: `drop-shadow(0 0 3px ${c})` }} />
                            </marker>
                        ))}
                        <filter id="flyingGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    {lines.map((acc, i) => {
                        if (acc.isSelf) {
                            return (
                                <g key={i} transform={`translate(${acc.start.x}, ${acc.start.y})`}>
                                    <circle cx="0" cy="0" r="28" fill="none" stroke={acc.color} strokeWidth="2.5" strokeDasharray="5,3" style={{ animation: 'rotateSelfTrans 8s linear infinite' }} />
                                    <circle cx="0" cy="0" r="8" fill={acc.color} fillOpacity="0.3" />
                                    <rect x="22" y="-14" width="52" height="24" rx="12" fill={acc.color} />
                                    <text x="48" y="3" textAnchor="middle" fill="#ffffff" fontSize="12" fontWeight="900">自化{acc.type}</text>
                                </g>
                            );
                        }
                        const dx = acc.end.x - acc.start.x;
                        const dy = acc.end.y - acc.start.y;

                        // Midpoint of quadratic Bezier: B(0.5) = 0.25*P0 + 0.5*P1 + 0.25*P2
                        const midX = (acc.start.x + acc.end.x) / 2;
                        const midY = (acc.start.y + acc.end.y) / 2;
                        const cpX = midX - dy * 0.22;
                        const cpY = midY + dx * 0.22;

                        const labelX = 0.25 * acc.start.x + 0.5 * cpX + 0.25 * acc.end.x;
                        const labelY = 0.25 * acc.start.y + 0.5 * cpY + 0.25 * acc.end.y;

                        return (
                            <g key={i}>
                                {/* 底層發光軌跡 */}
                                <path d={`M ${acc.start.x} ${acc.start.y} Q ${cpX} ${cpY} ${acc.end.x} ${acc.end.y}`}
                                    stroke={acc.color} strokeWidth="5" strokeOpacity="0.25" fill="none" />
                                {/* 動態流光虛線 */}
                                <path d={`M ${acc.start.x} ${acc.start.y} Q ${cpX} ${cpY} ${acc.end.x} ${acc.end.y}`}
                                    stroke={acc.color} strokeWidth="2.8" className={acc.streamClass} fill="none" markerEnd={`url(#arrow-${acc.color.replace('#', '')})`} />
                                {/* 目標宮星曜節點 */}
                                <circle cx={acc.end.x} cy={acc.end.y} r="6" fill={acc.color} stroke="#ffffff" strokeWidth="2" style={{ filter: `drop-shadow(0 0 6px ${acc.color})` }} />
                                {/* 四化浮動徽章 */}
                                <g transform={`translate(${labelX}, ${labelY})`}>
                                    <circle r="14" fill="#ffffff" stroke={acc.color} strokeWidth="2.5" style={{ filter: 'drop-shadow(0 2px 5px rgba(0,0,0,0.2))' }} />
                                    <circle r="11" fill={acc.color} fillOpacity="0.15" />
                                    <text dy="5" textAnchor="middle" fill={acc.color} fontSize="13" fontWeight="900">{acc.type}</text>
                                </g>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // --- 四化飛星因果牽引儀面板 ---
        const FlyingStarResonanceChamber = ({ focusedId, chartData, onConsult }) => {
            if (focusedId === null || focusedId === -1 || !chartData) return null;
            const palace = chartData.find(c => c.id === focusedId);
            if (!palace) return null;

            const gan = palace.gan;
            const trans = SI_HUA_TABLE[gan];
            if (!trans) return null;

            const getTargetPalaceName = (starName) => {
                const target = chartData.find(c => c.stars.some(s => (typeof s === 'string' ? s : s.name).indexOf(starName) > -1));
                return target ? target.palaceName : '外宮';
            };

            const items = [
                { type: '化祿', star: trans.lu, target: getTargetPalaceName(trans.lu), color: 'text-emerald-700 bg-emerald-50 border-emerald-200 ring-emerald-100', dot: 'bg-emerald-500', desc: '主福緣引動、契機萌生、緣起與利益流向' },
                { type: '化權', star: trans.quan, target: getTargetPalaceName(trans.quan), color: 'text-red-700 bg-red-50 border-red-200 ring-red-100', dot: 'bg-red-500', desc: '主開拓主導、掌控欲、企圖心與競爭突破' },
                { type: '化科', star: trans.ke, target: getTargetPalaceName(trans.ke), color: 'text-purple-700 bg-purple-50 border-purple-200 ring-purple-100', dot: 'bg-purple-500', desc: '主聲譽清白、逢凶化吉、文采與貴人暗助' },
                { type: '化忌', star: trans.ji, target: getTargetPalaceName(trans.ji), color: 'text-blue-700 bg-blue-50 border-blue-200 ring-blue-100', dot: 'bg-blue-500', desc: '主執念牽絆、因果承擔、責任破耗與修心關卡' }
            ];

            return (
                <div className="mt-4 bg-gradient-to-r from-fuchsia-900/90 via-indigo-950/90 to-purple-950/90 rounded-2xl p-4 text-white shadow-xl border border-fuchsia-500/30 backdrop-blur-md">
                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-fuchsia-400/20 pb-3">
                        <div className="flex items-center gap-2">
                            <span className="text-xl">🌌</span>
                            <div>
                                <h4 className="text-sm font-black tracking-wider text-fuchsia-200">
                                    四化飛星因果儀 · 【{palace.palaceName} · {palace.gan}{palace.zhi}】
                                </h4>
                                <p className="text-[11px] text-fuchsia-300/80">
                                    以「{palace.gan}干」發動四化，貫穿周天因果牽引鏈
                                </p>
                            </div>
                        </div>
                        {onConsult && (
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => window.openAcademyModal && window.openAcademyModal('flying')}
                                    className="px-2.5 py-1 bg-white/10 hover:bg-white/20 text-fuchsia-200 text-xs font-bold rounded-xl border border-white/10 transition-all flex items-center gap-1"
                                >
                                    <span>📖</span> 飛星心法
                                </button>
                                <button
                                    onClick={() => onConsult(`請紫微天機道長為我深度解析【${palace.palaceName}】天干【${palace.gan}】發射之四化飛星（化祿入${items[0].target}、化權入${items[1].target}、化科入${items[2].target}、化忌入${items[3].target}）的因果牽引與破局玄機！`)}
                                    className="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-amber-500/30 transition-all flex items-center gap-1.5 transform hover:scale-105"
                                >
                                    <span>🔮</span> 呼叫宗師詳批此宮飛星
                                </button>
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 mt-3">
                        {items.map((it, idx) => {
                            const isSelf = it.target === palace.palaceName;
                            return (
                                <div key={idx} className="bg-white/10 rounded-xl p-2.5 border border-white/10 hover:border-white/20 transition-all">
                                    <div className="flex items-center justify-between mb-1">
                                        <div className="flex items-center gap-1.5">
                                            <span className={`w-2 h-2 rounded-full ${it.dot} animate-pulse`}></span>
                                            <span className="text-xs font-black text-white">{it.type}【{it.star}】</span>
                                        </div>
                                        {isSelf && (
                                            <span className="px-1.5 py-0.5 bg-fuchsia-500 text-[10px] font-black rounded-full">自化</span>
                                        )}
                                    </div>
                                    <div className="text-xs font-bold text-amber-300">
                                        ➔ 飛入【{it.target}】
                                    </div>
                                    <p className="text-[10px] text-slate-300 mt-1 leading-snug">
                                        {it.desc}
                                    </p>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };


        // ... (保留 calculateStars 函數) ...
        // --- 三方四正 SVG 連線元件 (動態計算版) ---
        const SanFangSiZhengLines = ({ focusedId }) => {
            const [coords, setCoords] = useState(null);

            const calculateCoords = () => {
                if (focusedId === null || focusedId === -1) return;

                const container = document.getElementById('chart-grid-container');
                if (!container) return;
                const containerRect = container.getBoundingClientRect();

                const getCenter = (id) => {
                    const el = document.getElementById(`palace-${id}`);
                    if (!el) return { x: 0, y: 0 };
                    const rect = el.getBoundingClientRect();
                    return {
                        x: rect.left + rect.width / 2 - containerRect.left,
                        y: rect.top + rect.height / 2 - containerRect.top
                    };
                };

                const start = getCenter(focusedId);
                const opposite = getCenter((focusedId + 6) % 12);
                const tri1 = getCenter((focusedId + 4) % 12);
                const tri2 = getCenter((focusedId + 8) % 12);
                const clampLeft = getCenter((focusedId + 11) % 12); // Previous
                const clampRight = getCenter((focusedId + 1) % 12); // Next

                setCoords({ start, opposite, tri1, tri2, clampLeft, clampRight });
            };

            useLayoutEffect(() => {
                calculateCoords();
                window.addEventListener('resize', calculateCoords);
                return () => window.removeEventListener('resize', calculateCoords);
            }, [focusedId]);

            if (!coords || focusedId === null || focusedId === -1) return null;

            const { start, opposite, tri1, tri2, clampLeft, clampRight } = coords;

            const renderLabel = (pos, text, color, bgColor = "white") => (
                <g>
                    <circle cx={pos.x} cy={pos.y} r="16" fill={bgColor} fillOpacity="0.2" stroke={color} strokeWidth="1" strokeOpacity="0.5" />
                    <text x={pos.x} y={pos.y} dy="4" textAnchor="middle" fill={color} fontSize="14" fontWeight="900" style={{ textShadow: '0px 0px 2px rgba(255,255,255,0.8)' }}>{text}</text>
                </g>
            );

            return (
                <svg className="absolute top-0 left-0 w-full h-full pointer-events-none z-20 overflow-visible">
                    <defs>
                        <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">

                    const daYunArr = yun.getDaYun();
                    // Displaying full Da Yun list (0-10) to ensure the first cycle is always visible

                    const startYunText = `出生後${yun.getStartYear()}年${yun.getStartMonth()}個月又${yun.getStartDay()}天上大運`;

                    let taiYuan = safeGet(finalLunar, 'getTaiYuan');
                    let mingGong = safeGet(finalLunar, 'getMingGong');
                    const shenGong = (typeof finalLunar.getShenGong === 'function') ? finalLunar.getShenGong() : mingGong;
                    const taiXi = (typeof finalLunar.getTaiXi === 'function') ? finalLunar.getTaiXi() : "";

                    // Manual Fallback for Tai Yuan (胎元)
                    if (taiYuan === '-' || !taiYuan) {
                        const STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
                        const BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

                        const mGan = eightChar.getMonthGan();
                        const mZhi = eightChar.getMonthZhi();
                        const mgIdx = STEMS.indexOf(mGan);
                        const mzIdx = BRANCHES.indexOf(mZhi);

                        if (mgIdx !== -1 && mzIdx !== -1) {
                            const tGan = STEMS[(mgIdx + 1) % 10];
                            const tZhi = BRANCHES[(mzIdx + 3) % 12];
                            taiYuan = tGan + tZhi;
                        }
                    }

                    // Manual Fallback for Ming Gong (命宮)
                    if (mingGong === '-' || !mingGong) {
                        const STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
                        const BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];

                        // Formula: 14 or 26 - (Month + Hour). Indices:Yin=1 ... Chou=12
                        const getZhiNum = (zhi) => {
                            const idx = BRANCHES.indexOf(zhi); // 0=Zi, 1=Chou, 2=Yin...
                            // Map:Zi=11, Chou=12, Yin=1 ... Hai=10
                            if (idx === 0) return 11;
                            if (idx === 1) return 12;
                            return idx - 1;
                        };

                        const mNum = getZhiNum(eightChar.getMonthZhi());
                        const hNum = getZhiNum(eightChar.getTimeZhi());

                        let total = mNum + hNum;
                        let res = (total > 14) ? (26 - total) : (14 - total);
                        // If res still > 12 or < 1? 
                        // Standard formula often: "26 - (M+H)". If >12 subtract 12.
                        // Let's use simpler: (14 - (m + h)) % 12. If <=0 add 12.

                        // Let's trust "26 - (M+H)" then mod 12 logic.
                        // Example:Yin(1) + Zi(11) = 12. 26-12=14. 14-12=2. 2=Mao. 
                        // Correct? MingGong at Mao for Yin Month Zi Hour? Yes.

                        let rawRes = 26 - (mNum + hNum);
                        while (rawRes > 12) rawRes -= 12;

                        let mgBranchIdx;
                        // Map back rawRes (1..12) to BRANCHES index (0..11)
                        // 1=Yin(2), 2=Mao(3), 11=Zi(0), 12=Chou(1)
                        if (rawRes === 11) mgBranchIdx = 0;
                        else if (rawRes === 12) mgBranchIdx = 1;
                        else mgBranchIdx = rawRes + 1;

                        const mgZhi = BRANCHES[mgBranchIdx];

                        // Wu Hu Dun for Stem
                        // Year Gan -> Month 1 (Yin) Stem
                        const yGanIdx = STEMS.indexOf(eightChar.getYearGan());
                        const tigerStemIdx = (yGanIdx % 5) * 2 + 2; // Jia(0)->Bing(2)

                        // Distance from Yin(2) to mgBranchIdx
                        // Indices: 0..11. 
                        let offset = (mgBranchIdx - 2 + 12) % 12;
                        const mgGanIdx = (tigerStemIdx + offset) % 10;

                        mingGong = STEMS[mgGanIdx] + mgZhi;
                    }

                    const dayKong = safeGet(finalLunar, 'getDayXunKong');

                        shenGong,
                        yearKong,
                        dayKong,
                        zodiacSign,

                    });

                    setError(e.message || "Unknown Error");
