                        {loading ? (
                            <div className="py-16 text-center">
                                <Icon name="loader" className="w-8 h-8 animate-spin mx-auto text-red-400 mb-2" />
                                <p className="text-xs text-slate-400 font-bold">正在演算 2026 丙午流年十二月令氣場...</p>
                            </div>
                        ) : radarData ? (
                            <div className="space-y-6">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
                                    {radarData.four_transforms.map((item, idx) => (
                                        <div key={idx} className="p-3 rounded-2xl bg-white/5 border border-red-500/20 text-center">
                                            <div className="flex items-center justify-center gap-1.5 mb-1">
                                                <span className="font-black text-amber-200 text-sm">{item.star}</span>
                                                <span className={`text-[10px] font-black px-1.5 py-0.5 rounded ${item.trans === '化忌' ? 'bg-rose-500/30 text-rose-300' : 'bg-emerald-500/30 text-emerald-300'}`}>
                                                    {item.trans}
                                                </span>
                                            </div>
                                            <p className="text-[10px] text-slate-300 leading-tight">{item.effect}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="p-5 rounded-3xl bg-emerald-950/30 border border-emerald-500/40">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-black text-emerald-300 flex items-center gap-1.5">
                                                <Icon name="trending-up" className="w-4 h-4 text-emerald-400" /> 年度最強巔峰月
                                            </span>
                                            <span className="px-2.5 py-0.5 rounded-full bg-emerald-500/30 text-emerald-200 font-black text-xs">
                                                {radarData.peak_month.score} 分
                                            </span>
                                        </div>
                                        <h5 className="text-base font-black text-white">{radarData.peak_month.name} · {radarData.peak_month.theme}</h5>
                                        <p className="text-xs text-emerald-200/80 mt-1 leading-relaxed">{radarData.peak_month.advice}</p>
                                    </div>

                                    <div className="p-5 rounded-3xl bg-rose-950/30 border border-rose-500/40">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-black text-rose-300 flex items-center gap-1.5">
                                                <Icon name="shield-alert" className="w-4 h-4 text-rose-400" /> 年度謹慎防守月
                                            </span>
                                            <span className="px-2.5 py-0.5 rounded-full bg-rose-500/30 text-rose-200 font-black text-xs">
                                                {radarData.caution_month.score} 分
                                            </span>
                                        </div>
                                        <h5 className="text-base font-black text-white">{radarData.caution_month.name} · {radarData.caution_month.theme}</h5>
                                        <p className="text-xs text-rose-200/80 mt-1 leading-relaxed">{radarData.caution_month.advice}</p>
                                    </div>
                                </div>

                                <div className="p-5 rounded-3xl bg-black/40 border border-white/10">
                                    <h5 className="text-xs font-black text-amber-300 mb-3 flex items-center gap-1.5">
                                        <Icon name="bar-chart-2" className="w-4 h-4" /> 1~12 月四季氣數波動明細
                                    </h5>
                                    <div className="space-y-2 max-h-[280px] overflow-y-auto pr-1">
                                        {radarData.monthly_data.map((m, idx) => (
                                            <div key={idx} className="flex items-center justify-between p-2.5 rounded-xl bg-white/5 hover:bg-white/10 transition-colors text-xs">
                                                <div className="w-28 font-bold text-white flex items-center gap-1">
                                                    <span>{m.name}</span>
                                                </div>
                                                <div className="flex-1 px-4 truncate text-slate-300 text-[11px]">
                                                    {m.theme}
                                                </div>
                                                <div className="flex items-center gap-3 shrink-0 font-mono">
                                                    <span className="text-amber-300">財 {m.wealth}</span>
                                                    <span className="text-indigo-300">事 {m.career}</span>
                                                    <span className="text-pink-300">情 {m.love}</span>
                                                    <span className="font-black text-white px-2 py-0.5 rounded bg-white/10">{m.overall}分</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : null}
                    </div>
                </div>
            );
        };

        // --- 天機靈籤與擲筊求籤 Modal ---
        const TempleModal = ({ userName, onClose }) => {
            const [templeType, setTempleType] = React.useState('guanyin');
            const [question, setQuestion] = React.useState('');
            const [step, setStep] = React.useState('draw'); // 'draw' | 'toss' | 'result'
            const [isDrawing, setIsDrawing] = React.useState(false);
            const [currentLot, setCurrentLot] = React.useState(null);
            const [isTossing, setIsTossing] = React.useState(false);
            const [tossHistory, setTossHistory] = React.useState([]);
            const [latestToss, setLatestToss] = React.useState(null);

            const templeTitles = {
                guanyin: { name: "普陀山 · 觀音大士靈籤", desc: "大慈大悲，救苦救難，指引人生迷津", color: "from-rose-500 to-pink-600" },
                guandi: { name: "解州祖廟 · 關聖帝君靈籤", desc: "忠義千秋，威靈赫赫，專斷事業財運", color: "from-amber-600 to-red-700" },
                mazu: { name: "鹿港朝天宮 · 媽祖百籤", desc: "海神聖母，慈航普渡，庇佑家宅平安與出行", color: "from-blue-600 to-indigo-700" }
            };

            const playLotRattleSound = () => {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(500 + Math.random() * 350, ctx.currentTime);
                            osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.06);
                            gain.gain.setValueAtTime(0.4, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start();
                            osc.stop(ctx.currentTime + 0.06);
                        }, i * 120);
                    }
                } catch (e) {}
            };

            const handleDraw = async () => {
                setIsDrawing(true);
                playLotRattleSound();
                setCurrentLot(null);
                setTossHistory([]);
                setLatestToss(null);
                try {
                    const res = await fetch('/api/temple_draw', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ temple_type: templeType })
                    });
                    const data = await res.json();
                    setTimeout(() => {
                        setCurrentLot(data.lot);
                        setIsDrawing(false);
                        setStep('toss');
                    }, 1400);
                } catch (e) {
                    alert('抽籤感應未通，請稍後重試：' + e.message);
                    setIsDrawing(false);
                }
            };

            const renderLotCylinder = (isDrawing) => (
                <div className="relative w-44 h-56 flex flex-col items-center justify-end my-2">
                    <div className={`absolute inset-0 rounded-full bg-amber-500/20 blur-xl transition-opacity ${isDrawing ? 'opacity-100 scale-125 animate-pulse' : 'opacity-30'}`}></div>
                    <div className={`absolute top-2 z-20 transition-all duration-700 flex flex-col items-center ${isDrawing ? 'translate-y-[-50px] scale-110 drop-shadow-[0_0_25px_rgba(251,191,36,0.9)]' : 'translate-y-6 opacity-60'}`}>
                        <div className="w-4 h-28 bg-gradient-to-b from-red-600 via-amber-200 to-amber-400 border border-amber-300 rounded-t-md flex flex-col items-center justify-between py-1.5 shadow-xl">
                            <span className="w-2 h-2 rounded-full bg-red-700 border border-amber-200"></span>
                            <span className="text-[10px] font-black text-amber-950 [writing-mode:vertical-lr] tracking-widest font-serif">頭籤大吉</span>
                            <span className="w-1.5 h-1.5 rounded-full bg-amber-700"></span>
                        </div>
                    </div>
                    <div className={`w-32 h-40 relative z-10 filter drop-shadow-[0_15px_20px_rgba(0,0,0,0.85)] ${isDrawing ? 'animate-lot-shake' : 'hover:scale-105 transition-transform'}`}>
                        <svg viewBox="0 0 120 160" className="w-full h-full">
                            <defs>
                                <linearGradient id="bambooBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#78350f" />
                                    <stop offset="25%" stopColor="#451a03" />
                                    <stop offset="60%" stopColor="#290f02" />
                                    <stop offset="100%" stopColor="#78350f" />
                                </linearGradient>
                                <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor="#fef08a" />
                                    <stop offset="50%" stopColor="#eab308" />
                                    <stop offset="100%" stopColor="#ca8a04" />
                                </linearGradient>
                                <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#ef4444" />
                                    <stop offset="25%" stopColor="#fef08a" />
                                    <stop offset="100%" stopColor="#d97706" />
                                </linearGradient>
                            </defs>
                            <g className={isDrawing ? 'animate-pulse' : ''}>
                                <rect x="35" y="10" width="6" height="50" rx="3" fill="url(#stickGrad)" transform="rotate(-15 35 10)" />
                                <rect x="45" y="5" width="6" height="55" rx="3" fill="url(#stickGrad)" transform="rotate(-8 45 5)" />
                                <rect x="57" y="2" width="6" height="58" rx="3" fill="url(#stickGrad)" transform="rotate(0 57 2)" />
                                <rect x="68" y="5" width="6" height="55" rx="3" fill="url(#stickGrad)" transform="rotate(8 68 5)" />
                                <rect x="78" y="10" width="6" height="50" rx="3" fill="url(#stickGrad)" transform="rotate(15 78 10)" />
                            </g>
                            <ellipse cx="60" cy="40" rx="45" ry="12" fill="url(#goldRimGrad)" stroke="#78350f" strokeWidth="2" />
                            <ellipse cx="60" cy="40" rx="38" ry="8" fill="#1c0a00" />
                            <path d="M 15 40 Q 20 100 22 145 L 98 145 Q 100 100 105 40 Z" fill="url(#bambooBodyGrad)" stroke="#78350f" strokeWidth="2" />
                            <path d="M 17 65 Q 60 75 103 65 L 102 73 Q 60 83 18 73 Z" fill="url(#goldRimGrad)" opacity="0.95" />
                            <path d="M 20 120 Q 60 130 100 120 L 99 127 Q 60 137 21 127 Z" fill="url(#goldRimGrad)" opacity="0.95" />
                            <rect x="42" y="78" width="36" height="36" rx="4" fill="#7f1d1d" stroke="#eab308" strokeWidth="1.5" />
                            <text x="60" y="95" fill="#fef08a" fontSize="11" fontWeight="900" fontFamily="serif" textAnchor="middle">天機</text>
                            <text x="60" y="108" fill="#fef08a" fontSize="11" fontWeight="900" fontFamily="serif" textAnchor="middle">靈籤</text>
                            <ellipse cx="60" cy="145" rx="38" ry="8" fill="url(#goldRimGrad)" />
                        </svg>
                    </div>
                    <div className="w-36 h-4 bg-black/60 rounded-full blur-md mt-1"></div>
                </div>
            );

            const playPoeSound = () => {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.setValueAtTime(450, ctx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.08);
                    gain1.gain.setValueAtTime(0.8, ctx.currentTime);
                    gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start();
                    osc1.stop(ctx.currentTime + 0.08);

                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.type = 'sine';
                        osc2.frequency.setValueAtTime(320, ctx.currentTime);
                        osc2.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.06);
                        gain2.gain.setValueAtTime(0.5, ctx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.start();
                        osc2.stop(ctx.currentTime + 0.06);
                    }, 140);
                } catch (e) {}
            };

            const handleToss = async () => {
                setIsTossing(true);
                playPoeSound();
                try {
                    const res = await fetch('/api/temple_toss', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({})
                    });
                    const data = await res.json();
                    setTimeout(() => {
                        playPoeSound();
                        setLatestToss(data.toss);
                        setTossHistory(prev => [...prev, data.toss]);
                        setIsTossing(false);
                        if (data.toss.is_confirmed) {
                            setTimeout(() => setStep('result'), 1200);
                        }
                    }, 1100);
                } catch (e) {
                    alert('擲筊失敗：' + e.message);
                    setIsTossing(false);
                }
            };

            const renderSinglePoe = (isFlat, side) => {
                const isLeft = side === 'left';
                return (
                    <div className={`relative w-24 h-28 flex items-center justify-center filter drop-shadow-2xl transition-transform ${isLeft ? 'rotate-[-15deg]' : 'rotate-[15deg]'}`}>
                        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-[0_8px_12px_rgba(0,0,0,0.7)]">
                            <defs>
                                <linearGradient id={`woodGrad_${side}`} x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#fef3c7" />
                                    <stop offset="40%" stopColor="#f59e0b" />
                                    <stop offset="100%" stopColor="#b45309" />
                                </linearGradient>
                                <linearGradient id={`lacquerGrad_${side}`} x1="20%" y1="0%" x2="80%" y2="100%">
                                    <stop offset="0%" stopColor="#f87171" />
                                    <stop offset="35%" stopColor="#dc2626" />
                                    <stop offset="80%" stopColor="#881337" />
                                    <stop offset="100%" stopColor="#450a0a" />
                                </linearGradient>
                                <linearGradient id={`shineGrad_${side}`} x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#ffffff" stopOpacity="0.75" />
                                    <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
                                </linearGradient>
                            </defs>
                            {isFlat ? (
                                <g>
                                    <path
                                        d={isLeft ? "M 65 10 C 20 25 10 80 55 110 C 32 80 35 38 65 10 Z" : "M 35 10 C 80 25 90 80 45 110 C 68 80 65 38 35 10 Z"}
                                        fill={`url(#woodGrad_${side})`}
                                        stroke="#92400e"
                                        strokeWidth="2.5"
                                    />
                                    <path
                                        d={isLeft ? "M 55 25 Q 30 50 48 95" : "M 45 25 Q 70 50 52 95"}
                                        fill="none"
                                        stroke="#78350f"
                                        strokeWidth="1.5"
                                        strokeOpacity="0.4"
                                        strokeDasharray="4 2"
                                    />
                                    <text
                                        x={isLeft ? "42" : "54"}
                                        y="62"
                                        fill="#991b1b"
                                        fontSize="17"
                                        fontWeight="900"
                                        fontFamily="serif"
                                        textAnchor="middle"
                                        opacity="0.9"
                                    >
                                        陽
                                    </text>
                                </g>
                            ) : (
                                <g>
                                    <path
                                        d={isLeft ? "M 65 10 C 20 25 10 80 55 110 C 32 80 35 38 65 10 Z" : "M 35 10 C 80 25 90 80 45 110 C 68 80 65 38 35 10 Z"}
                                        fill={`url(#lacquerGrad_${side})`}
                                        stroke="#7f1d1d"
                                        strokeWidth="2.5"
                                    />
                                    <path
                                        d={isLeft ? "M 58 20 C 30 35 25 70 48 98" : "M 42 20 C 70 35 75 70 52 98"}
                                        fill="none"
                                        stroke={`url(#shineGrad_${side})`}
                                        strokeWidth="4"
                                        strokeLinecap="round"
                                    />
                                    <text
                                        x={isLeft ? "42" : "54"}
                                        y="62"
                                        fill="#fef3c7"
                                        fontSize="17"
                                        fontWeight="900"
                                        fontFamily="serif"
                                        textAnchor="middle"
                                        opacity="0.9"
                                    >
                                        陰
                                    </text>
                                </g>
                            )}
                        </svg>
                    </div>
                );
            };

            const handleDirectReveal = () => {
                setStep('result');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in" onClick={onClose}>
                    <div className="bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 border border-amber-500/40 rounded-[2.5rem] shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto text-white p-6 md:p-8 relative" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-6 right-6 p-2 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white transition-colors">
                            <Icon name="x" className="w-5 h-5" />
                        </button>

                        <div className="text-center mb-6">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-xs font-black tracking-widest uppercase mb-2">
                                <Icon name="flame" className="w-3.5 h-3.5" /> 神明靈籤 · 擲筊問卜
                            </div>
                            <h3 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-100 to-amber-300 font-serif">
                                {templeTitles[templeType].name}
                            </h3>
                            <p className="text-xs text-slate-300 mt-1">{templeTitles[templeType].desc}</p>
                        </div>

                        {/* 籤筒選擇切換 */}
                        <div className="grid grid-cols-3 gap-2 mb-6">
                            {[
                                { key: 'guanyin', name: '觀音靈籤', icon: 'heart' },
                                { key: 'guandi', name: '關帝靈籤', icon: 'shield' },
                                { key: 'mazu', name: '天上聖母籤', icon: 'anchor' }
                            ].map(t => (
                                <button
                                    key={t.key}
                                    onClick={() => { setTempleType(t.key); setStep('draw'); setCurrentLot(null); setLatestToss(null); }}
                                    className={`py-2.5 px-3 rounded-2xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${templeType === t.key ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 shadow-lg shadow-amber-500/30 ring-2 ring-amber-300' : 'bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10'}`}
                                >
                                    <Icon name={t.icon} className="w-3.5 h-3.5" /> {t.name}
                                </button>
                            ))}
                        </div>

                        {/* 功能模式切換：【籤筒搖籤求籤】 / 【直解聖筊問卜】 */}
                        <div className="flex gap-2 mb-6 p-1 bg-black/40 rounded-2xl border border-amber-500/30">
                            <button
                                onClick={() => setStep('draw')}
                                className={`flex-1 py-2.5 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${step === 'draw' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 shadow-md ring-1 ring-amber-300' : 'text-slate-300 hover:text-white'}`}
                            >
                                <Icon name="sparkles" className="w-3.5 h-3.5" /> 籤筒搖籤求籤
                            </button>
                            <button
                                onClick={() => {
                                    if (!currentLot) {
                                        setCurrentLot({ title: '誠心向神明請示吉凶判語', poem: '天道酬勤，心誠則靈。', level: '聖聖聖', element: '天地靈氣', legend: '神明親臨指引' });
                                    }
                                    setStep('toss');
                                }}
                                className={`flex-1 py-2.5 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${step === 'toss' ? 'bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 shadow-md ring-1 ring-amber-300' : 'text-slate-300 hover:text-white'}`}
                            >
                                <Icon name="rotate-ccw" className="w-3.5 h-3.5" /> 直解聖筊問卜
                            </button>
                        </div>

                        {/* 步驟一：抽籤 */}
                        {step === 'draw' && (
                            <div className="bg-white/5 border border-white/10 rounded-3xl p-6 text-center space-y-5">
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-amber-300">請默念緣主姓名與心中所祈求之事：</label>
                                    <input
                                        type="text"
                                        value={question}
                                        onChange={e => setQuestion(e.target.value)}
                                        placeholder="例如：弟子求問今年創業經商吉凶..."
                                        className="w-full bg-black/40 border border-amber-400/30 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-amber-400"
                                    />
                                </div>

                                <div className="py-4 flex flex-col items-center justify-center">
                                    {renderLotCylinder(isDrawing)}
                                    <p className="text-xs text-amber-200 mt-2 font-medium">
                                        {isDrawing ? "✨ 神光感應，竹籤震響，正在誠心搖動籤筒..." : "心誠則靈，點擊下方「誠心搖籤」按鈕抽取神籤"}
                                    </p>
                                </div>

                                <button
                                    onClick={handleDraw}
                                    disabled={isDrawing}
                                    className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-black rounded-2xl text-sm flex items-center justify-center gap-2 shadow-xl shadow-amber-500/20 active:scale-95 transition-all disabled:opacity-50"
                                >
                                    {isDrawing ? <Icon name="loader" className="w-4 h-4 animate-spin" /> : <Icon name="sparkles" className="w-4 h-4" />}
                                    {isDrawing ? "神明搖籤中..." : "誠心搖籤抽取神籤"}
                                </button>
                            </div>
                        )}

                        {/* 步驟二：擲筊確認 */}
                        {step === 'toss' && currentLot && (
                            <div className="bg-white/5 border border-white/10 rounded-3xl p-6 text-center space-y-5 animate-in fade-in">
                                <div className="p-4 bg-amber-950/40 border border-amber-500/30 rounded-2xl">
                                    <span className="text-xs text-amber-300 font-black">抽得籤支</span>
                                    <h4 className="text-xl font-black text-amber-100 font-serif mt-1">{currentLot.title}</h4>
                                    <p className="text-xs text-slate-300 mt-1">需向神明擲筊請示，獲【聖筊】方能開解籤詩</p>
                                </div>

                                <div className="py-4 flex flex-col items-center justify-center">
                                    {/* 廟宇紅錦絨跪墊（擲筊物理落地區） */}
                                    <div className="w-full bg-gradient-to-b from-red-950/90 via-red-900/70 to-red-950/90 border-2 border-amber-500/60 rounded-3xl p-6 shadow-[inset_0_0_25px_rgba(245,158,11,0.25)] relative overflow-hidden my-2">
                                        <div className="absolute top-2 left-2 text-amber-500/40 text-xs font-serif">✦</div>
                                        <div className="absolute top-2 right-2 text-amber-500/40 text-xs font-serif">✦</div>
                                        <div className="absolute bottom-2 left-2 text-amber-500/40 text-xs font-serif">✦</div>
                                        <div className="absolute bottom-2 right-2 text-amber-500/40 text-xs font-serif">✦</div>
                                        
                                        <div className="text-center text-[10px] text-amber-400/40 font-black tracking-widest uppercase mb-3">
                                            ──────── 聖殿神明擲筊專區 ────────
                                        </div>

                                        {/* 3D 聖筊雙塊物理拋擲 */}
                                        <div className="flex items-center justify-center gap-10 min-h-[140px] relative py-2">
                                            <div className={`transition-all duration-300 ${isTossing ? 'animate-poe-toss-left' : 'hover:scale-105'}`}>
                                                {renderSinglePoe(latestToss ? (latestToss.block1 === '陽') : false, 'left')}
                                            </div>
                                            <div className={`transition-all duration-300 ${isTossing ? 'animate-poe-toss-right' : 'hover:scale-105'}`}>
                                                {renderSinglePoe(latestToss ? (latestToss.block2 === '陽') : true, 'right')}
                                            </div>
                                        </div>

                                        <p className="text-[11px] text-amber-200/70 text-center mt-3 font-medium">
                                            {isTossing ? "✨ 筊杯騰空翻轉，祈求神明賜予旨意..." : (latestToss ? `當前筊相：${latestToss.name}` : "請誠心默念祈求，點擊下方「擲筊請示神明」")}
                                        </p>
                                    </div>

                                    {latestToss && !isTossing && (
                                        <div className={`mt-3 p-4 rounded-2xl border text-xs font-bold w-full animate-in fade-in zoom-in duration-300 ${latestToss.is_confirmed ? 'bg-emerald-950/60 border-emerald-400/50 text-emerald-200 shadow-lg shadow-emerald-900/30' : 'bg-amber-950/60 border-amber-400/50 text-amber-200 shadow-lg shadow-amber-900/30'}`}>
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="text-base font-black font-serif tracking-wide">{latestToss.name}</span>
                                                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black ${latestToss.is_confirmed ? 'bg-emerald-500/30 text-emerald-300 border border-emerald-400/40' : 'bg-amber-500/30 text-amber-300 border border-amber-400/40'}`}>
                                                    {latestToss.is_confirmed ? "恭喜！獲得聖筊" : "請繼續擲筊"}
                                                </span>
                                            </div>
                                            <p className="text-slate-200 leading-relaxed font-normal">{latestToss.description}</p>
                                        </div>
                                    )}
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={handleToss}
                                        disabled={isTossing}
                                        className="flex-1 py-3.5 bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-700 hover:to-rose-800 text-white font-black rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-red-600/30 active:scale-95 disabled:opacity-50 transition-all"
                                    >
                                        {isTossing ? <Icon name="loader" className="w-4 h-4 animate-spin" /> : <Icon name="rotate-ccw" className="w-4 h-4" />}
                                        {isTossing ? "擲筊翻轉中..." : (latestToss ? "再次擲筊請示" : "擲筊請示神明")}
                                    </button>
                                    <button
                                        onClick={handleDirectReveal}
                                        className="px-4 py-3.5 bg-white/10 hover:bg-white/15 text-slate-300 text-xs font-bold rounded-2xl border border-white/10 transition-all"
                                    >
                                        直接看解籤
                                    </button>
                                    <button
                                        onClick={() => setStep('draw')}
                                        className="px-4 py-3.5 bg-white/5 hover:bg-white/10 text-slate-400 text-xs font-medium rounded-2xl transition-all"
                                    >
                                        重新抽籤
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 步驟三：籤詩詳解 */}
                        {step === 'result' && currentLot && (
                            <div className="space-y-5 animate-in fade-in zoom-in duration-300">
                                <div className="p-6 bg-gradient-to-br from-amber-950/40 via-indigo-950/30 to-slate-900 rounded-3xl border border-amber-400/40 text-center">
                                    <span className="text-[11px] font-black text-amber-300 tracking-widest">【{currentLot.element}】</span>
                                    <h4 className="text-2xl md:text-3xl font-black text-amber-100 font-serif my-2">{currentLot.title}</h4>
                                    <div className="inline-block px-4 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/30 text-xs font-black">
                                        {currentLot.level}
                                    </div>

                                    <div className="my-6 p-4 bg-black/40 border border-amber-500/30 rounded-2xl">
                                        <p className="text-sm md:text-base font-serif font-black text-amber-200 leading-relaxed whitespace-pre-line">
                                            {currentLot.poem}
                                        </p>
                                    </div>

                                    <div className="text-left space-y-3 text-xs">
                                        <div className="p-3 bg-white/5 rounded-xl border border-white/10">
                                            <span className="font-black text-amber-300">📜 典故淵源：</span>
                                            <span className="text-slate-200 ml-1">{currentLot.legend}</span>
                                        </div>
                                        <div className="p-3 bg-white/5 rounded-xl border border-white/10">
                                            <span className="font-black text-amber-300">🔍 仙機通釋：</span>
                                            <span className="text-slate-200 ml-1">{currentLot.meaning}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                                    {Object.entries(currentLot.aspects).map(([key, val]) => (
                                        <div key={key} className="p-3.5 rounded-2xl bg-white/5 border border-white/10">
                                            <span className="font-black text-amber-300 mr-1.5">✦ {key}：</span>
                                            <span className="text-slate-200">{val}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="p-4 rounded-2xl bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-400/40">
                                    <h5 className="text-xs font-black text-amber-300 mb-1 flex items-center gap-1.5">
                                        <Icon name="sparkles" className="w-3.5 h-3.5" /> 天機道長點撥心法
                                    </h5>
                                    <p className="text-xs text-slate-200 leading-relaxed">{currentLot.advice}</p>
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => { setStep('draw'); setCurrentLot(null); setLatestToss(null); }}
                                        className="flex-1 py-3 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-black rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/20"
                                    >
                                        <Icon name="rotate-ccw" className="w-4 h-4" /> 另求一籤
                                    </button>
                                    <button
                                        onClick={onClose}
                                        className="px-6 py-3 bg-white/10 hover:bg-white/15 text-slate-200 text-xs font-bold rounded-2xl border border-white/10"
                                    >
                                        感悟領受
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 家宅九宮飛星風水與開運日曆匯出 Modal ---
        const FengShuiModal = ({ userName, onClose }) => {
            const [facing, setFacing] = React.useState('坐北朝南');
            const [houseType, setHouseType] = React.useState('住宅公寓');
            const [loading, setLoading] = React.useState(false);
            const [fengshuiData, setFengshuiData] = React.useState(null);
            const [downloadDays, setDownloadDays] = React.useState(30);

            const fetchFengShui = async (f = facing) => {
                setLoading(true);
                try {
                    const res = await fetch('/api/fengshui_analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ facing: f, house_type: houseType })
                    });
                    const data = await res.json();
                    setFengshuiData(data.fengshui);
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                fetchFengShui();
            }, []);

            const handleExportICS = () => {
                const url = `/api/export_calendar_ics?name=${encodeURIComponent(userName || '緣主')}&days=${downloadDays}`;
                window.open(url, '_blank');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in" onClick={onClose}>
                    <div className="bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 border border-indigo-500/40 rounded-[2.5rem] shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto text-white p-6 md:p-8 relative" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-6 right-6 p-2 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white transition-colors">
                            <Icon name="x" className="w-5 h-5" />
                        </button>

                        <div className="text-center mb-6">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/20 border border-indigo-400/40 text-indigo-300 text-xs font-black tracking-widest uppercase mb-2">
                                <Icon name="compass" className="w-3.5 h-3.5" /> 2026 丙午年 · 紫白九宮飛星與開運日曆
                            </div>
                            <h3 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-200 via-sky-100 to-indigo-300 font-serif">
                                家宅開運風水羅盤 · 流日曆匯出
                            </h3>
                            <p className="text-xs text-slate-300 mt-1">洞悉九宮飛星吉凶方位，佈局財位、文昌位與化煞，一鍵匯入個人行事曆</p>
                        </div>

                        {/* 坐向設定 */}
                        <div className="bg-white/5 border border-white/10 rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <span className="text-xs font-bold text-slate-300">房屋坐向：</span>
                                <select
                                    value={facing}
                                    onChange={e => { setFacing(e.target.value); fetchFengShui(e.target.value); }}
                                    className="bg-slate-800 border border-indigo-400/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-400"
                                >
                                    {["坐北朝南", "坐南朝北", "坐東朝西", "坐西朝東", "坐西北朝東南", "坐東南朝西北", "坐東北朝西南", "坐西南朝東北"].map(d => (
                                        <option key={d} value={d}>{d}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-slate-300">格局：</span>
                                {["住宅公寓", "商辦店面", "獨立別墅"].map(t => (
                                    <button
                                        key={t}
                                        onClick={() => setHouseType(t)}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${houseType === t ? 'bg-indigo-600 text-white' : 'bg-white/5 text-slate-400'}`}
                                    >
                                        {t}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 九宮飛星盤 */}
                        {fengshuiData && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-3 gap-2.5 text-center">
                                    {[
                                        { key: 'southeast', name: '東南 · 巽宮', label: '正財位' },
                                        { key: 'south', name: '正南 · 離宮', label: '偏財武曲' },
                                        { key: 'southwest', name: '西南 · 坤宮', label: '文昌考運' },
                                        { key: 'east', name: '正東 · 震宮', label: '九紫大吉' },
                                        { key: 'center', name: '中宮 · 太極', label: '一白人緣' },
                                        { key: 'west', name: '正西 · 兌宮', label: '五黃大煞' },
                                        { key: 'northeast', name: '東北 · 艮宮', label: '三碧是非' },
                                        { key: 'north', name: '正北 · 坎宮', label: '七赤破耗' },
                                        { key: 'northwest', name: '西北 · 乾宮', label: '二黑病符' }
                                    ].map(cell => {
                                        const star = fengshuiData.stars_grid[cell.key];
                                        const isGood = star.nature.includes('吉');
                                        const isBad = star.nature.includes('凶');
                                        return (
                                            <div
                                                key={cell.key}
                                                className={`p-3.5 rounded-2xl border transition-all ${isGood ? 'bg-emerald-950/30 border-emerald-500/40 hover:border-emerald-400' : isBad ? 'bg-rose-950/30 border-rose-500/40 hover:border-rose-400' : 'bg-white/5 border-white/10'}`}
                                            >
                                                <div className="flex justify-between items-center text-[10px] text-slate-400 mb-1">
                                                    <span>{cell.name}</span>
                                                    <span className={`px-1.5 py-0.5 rounded font-black ${isGood ? 'bg-emerald-500/20 text-emerald-300' : isBad ? 'bg-rose-500/20 text-rose-300' : 'bg-white/10 text-slate-300'}`}>{star.nature}</span>
                                                </div>
                                                <h5 className="text-xs font-black text-white">{star.star}</h5>
                                                <p className="text-[11px] font-bold text-amber-300 mt-0.5">{star.field}</p>
                                                <p className="text-[10px] text-slate-300/80 mt-1 line-clamp-2">{star.advice}</p>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* 重點方位化解錦囊 */}
                                <div className="p-4 rounded-2xl bg-white/5 border border-white/10 space-y-2 text-xs">
                                    <h5 className="text-xs font-black text-amber-300 flex items-center gap-1.5">
                                        <Icon name="sparkles" className="w-3.5 h-3.5" /> 2026 丙午年 · 家宅開運重點佈局指南
                                    </h5>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-slate-200">
                                        <div>💰 <span className="font-bold text-amber-200">財位佈局：</span>{fengshuiData.key_spots['財位推薦']}</div>
                                        <div>📚 <span className="font-bold text-indigo-200">文昌利考：</span>{fengshuiData.key_spots['文昌位推薦']}</div>
                                        <div>🛡️ <span className="font-bold text-rose-300">避煞防範：</span>{fengshuiData.key_spots['避忌煞位']}</div>
                                        <div>🚪 <span className="font-bold text-sky-200">大門氣場：</span>{fengshuiData.key_spots['大門氣場']}</div>
                                    </div>
                                </div>

                                {/* 開運日曆 iCal 匯出區塊 */}
                                <div className="p-5 rounded-3xl bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 border border-indigo-400/40 flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div>
                                        <h4 className="text-sm font-black text-white flex items-center gap-2">
                                            <Icon name="calendar-days" className="w-4 h-4 text-indigo-300" />
                                            專屬流日吉凶開運日曆 (.ics)
                                        </h4>
                                        <p className="text-xs text-slate-300 mt-1">
                                            將每日貴人日、財運日、破財預警日一鍵加入 iPhone / Google 日曆
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-3 w-full md:w-auto">
                                        <select
                                            value={downloadDays}
                                            onChange={e => setDownloadDays(parseInt(e.target.value))}
                                            className="bg-slate-800 border border-white/20 rounded-xl px-3 py-2 text-xs text-white"
                                        >
                                            <option value={30}>未來 30 天</option>
                                            <option value={90}>未來 90 天</option>
                                            <option value={365}>整年度 (365天)</option>
                                        </select>
                                        <button
                                            onClick={handleExportICS}
                                            className="px-5 py-2.5 bg-gradient-to-r from-indigo-500 to-sky-600 hover:from-indigo-600 hover:to-sky-700 text-white font-black rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-indigo-500/30 active:scale-95 transition-all shrink-0"
                                        >
                                            <Icon name="download" className="w-4 h-4" /> 下載開運日曆
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AlmanacWidget = ({ userBirthDate }) => {
            const today = new Date();
            const [queryDate, setQueryDate] = React.useState({
                y: today.getFullYear(),
                m: today.getMonth() + 1,
                d: today.getDate()
            });
            const [data, setData] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            const fetchData = async () => {
                const dateStr = `${queryDate.y}-${String(queryDate.m).padStart(2, '0')}-${String(queryDate.d).padStart(2, '0')}`;
                setLoading(true);
                try {
                    const res = await fetch('/api/daily_omens', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            birth_date: userBirthDate,
                            target_date: dateStr
                        })
                    });
                    if (!res.ok) throw new Error("API error");
                    const json = await res.json();
                    setData(json);
                } catch (e) {
                    console.error("Almanac Fetch Error:", e);
                    setData(null);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => { fetchData(); }, [userBirthDate]);
            React.useEffect(() => { fetchData(); }, [queryDate.y, queryDate.m, queryDate.d]);

            const resetToday = () => {
                const now = new Date();
                setQueryDate({ y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() });
            };

            // Ultra-Compact Flip Card (Mini) with Interaction
            const FlipCard = ({ value, subLabel, onUp, onDown }) => {
                const [isFlipping, setIsFlipping] = React.useState(false);
                React.useEffect(() => {
                    setIsFlipping(true);
                    const timer = setTimeout(() => setIsFlipping(false), 600);
                    return () => clearTimeout(timer);
                }, [value]);

                return (
                    <div className="flex flex-col items-center">
                        <div className={`relative flip-card ${isFlipping ? 'flipping' : ''} group`}>
                            <div className="bg-slate-800 rounded-lg w-10 h-12 shadow-md border-b-2 border-black flex items-center justify-center relative overflow-hidden">
                                <div className="absolute top-1/2 left-0 w-full h-[1px] bg-black/40 z-10"></div>
                                <span className="text-xl font-black text-white tabular-nums">{value}</span>
                                <div className="absolute top-0.5 left-1/2 -translate-x-1/2 text-[6px] font-bold text-white/30 uppercase tracking-tighter">{subLabel}</div>

                                {/* Clickable Overlays */}
                                <div onClick={(e) => { e.stopPropagation(); onUp(); }} className="absolute top-0 left-0 w-full h-1/2 z-30 cursor-pointer hover:bg-white/10 transition-colors"></div>
                                <div onClick={(e) => { e.stopPropagation(); onDown(); }} className="absolute bottom-0 left-0 w-full h-1/2 z-30 cursor-pointer hover:bg-white/10 transition-colors"></div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Ultra-Compact JieQi (Mini)
            const JieQiBanner = ({ name }) => {
                return (
                    <div className="bg-gradient-to-br from-indigo-600 to-indigo-900 rounded-xl px-3 py-1 shadow-md border-b-2 border-indigo-950 relative overflow-hidden">
                        <span className="text-md font-black text-white tracking-[0.2em] z-20 drop-shadow-sm font-serif">{name}</span>
                    </div>
                );
            };

            const adjustDate = (type, delta) => {
                const current = new Date(queryDate.y, queryDate.m - 1, queryDate.d);
                if (type === 'month') {
                    current.setMonth(current.getMonth() + delta);
                } else if (type === 'day') {
                    current.setDate(current.getDate() + delta);
                }
                setQueryDate({
                    y: current.getFullYear(),
                    m: current.getMonth() + 1,
                    d: current.getDate()
                });
            };

            return (
                <div className="w-full mb-4 no-print">
                    <div className="bg-white/95 backdrop-blur-xl rounded-[1.5rem] border-2 border-indigo-400/20 shadow-xl overflow-hidden group transition-all duration-500">
                        {/* Status bar merged with Query Selectors Mini */}
                        <div className="bg-slate-900 px-4 py-1 flex justify-between items-center text-[9px] font-bold text-white/60">
                            <div className="flex items-center gap-2">
                                <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span>
                                <span className="uppercase tracking-widest text-indigo-300">Celestial Sync · 天機同步</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <select value={queryDate.y} onChange={e => setQueryDate({ ...queryDate, y: parseInt(e.target.value) })} className="bg-white/10 rounded px-1 outline-none text-white">
                                    {Array.from({ length: 41 }, (_, i) => today.getFullYear() - 20 + i).map(y => <option key={y} value={y} className="text-slate-800">{y}年</option>)}
                                </select>
                                <select value={queryDate.m} onChange={e => setQueryDate({ ...queryDate, m: parseInt(e.target.value) })} className="bg-white/10 rounded px-1 outline-none text-white">
                                    {Array.from({ length: 12 }, (_, i) => i + 1).map(m => <option key={m} value={m} className="text-slate-800">{m}月</option>)}
                                </select>
                                <select value={queryDate.d} onChange={e => setQueryDate({ ...queryDate, d: parseInt(e.target.value) })} className="bg-white/10 rounded px-1 outline-none text-white">
                                    {Array.from({ length: 31 }, (_, i) => i + 1).map(d => <option key={d} value={d} className="text-slate-800">{d}日</option>)}
                                </select>
                                <button onClick={resetToday} className="hover:text-white transition-colors">歸位今日</button>
                            </div>
                        </div>

                        {loading ? (
                            <div className="h-20 flex items-center justify-center"><Icon name="loader" className="w-5 h-5 animate-spin text-indigo-500 opacity-30" /></div>

        // --- 道家仙境背景禪樂合成引擎 (Web Audio API: 432Hz 頌缽與五聲音階) ---
        class ZenBgmEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.droneOsc1 = null;
                this.droneOsc2 = null;
                this.droneGain = null;
                this.isPlaying = false;
                this.volume = 0.35;
                this.duckFactor = 1.0;
                this.track = 0; // 0: 太虛引(432Hz頌缽), 1: 紫霄吟(五音仙琴), 2: 天機道(古剎鐘鳴)
                this.timer = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(this.volume * this.duckFactor, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            setVolume(v) {
                this.volume = Math.max(0, Math.min(1, v));
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.masterGain.gain.linearRampToValueAtTime(this.volume * this.duckFactor, this.ctx.currentTime + 0.1);
                }
            }
            duck(isDucking) {
                this.duckFactor = isDucking ? 0.2 : 1.0;
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.masterGain.gain.linearRampToValueAtTime(this.volume * this.duckFactor, this.ctx.currentTime + 0.3);
                }
            }
            startDrone() {
                if (!this.ctx || this.droneOsc1) return;
                const now = this.ctx.currentTime;
                // Warm ambient root chord (108Hz + 216Hz in 432Hz tuning)
                this.droneGain = this.ctx.createGain();
                this.droneGain.gain.setValueAtTime(0.001, now);
                this.droneGain.gain.linearRampToValueAtTime(0.12, now + 1.5);
                this.droneGain.connect(this.masterGain);

                this.droneOsc1 = this.ctx.createOscillator();
                this.droneOsc1.type = 'sine';
                this.droneOsc1.frequency.setValueAtTime(108, now);
                this.droneOsc1.connect(this.droneGain);
                this.droneOsc1.start(now);

                this.droneOsc2 = this.ctx.createOscillator();
                this.droneOsc2.type = 'triangle';
                this.droneOsc2.frequency.setValueAtTime(216, now);
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, now);
                this.droneOsc2.connect(filter);
                filter.connect(this.droneGain);
                this.droneOsc2.start(now);
            }
            stopDrone() {
                if (this.droneGain && this.ctx) {
                    const now = this.ctx.currentTime;
                    this.droneGain.gain.cancelScheduledValues(now);
                    this.droneGain.gain.linearRampToValueAtTime(0.0001, now + 0.5);
                }
                setTimeout(() => {
                    try {
                        if (this.droneOsc1) { this.droneOsc1.stop(); this.droneOsc1.disconnect(); this.droneOsc1 = null; }
                        if (this.droneOsc2) { this.droneOsc2.stop(); this.droneOsc2.disconnect(); this.droneOsc2 = null; }
                        if (this.droneGain) { this.droneGain.disconnect(); this.droneGain = null; }
                    } catch (e) { }
                }, 600);
            }
            playZenNote() {
                if (!this.isPlaying || !this.ctx) return;
                const now = this.ctx.currentTime;
                const scales = [
                    [108, 162, 216, 288, 324, 432, 576],
                    [216, 243, 270, 324, 364.5, 432, 486, 540, 648],
                    [144, 216, 288, 432, 576, 864]
                ];
                const currentScale = scales[this.track] || scales[0];
                const freq = currentScale[Math.floor(Math.random() * currentScale.length)];

                const osc = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = this.track === 1 ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(freq, now);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(freq * (this.track === 0 ? 2.76 : 1.5), now);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(this.track === 1 ? 1500 : 900, now);

                const duration = this.track === 0 ? 6.5 : (this.track === 1 ? 4.2 : 5.0);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.45, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain);

                osc.start(now);
                osc2.start(now);
                osc.stop(now + duration);
                osc2.stop(now + duration);

                const nextInterval = (this.track === 1 ? 2000 : 3000) + Math.random() * 1800;
                this.timer = setTimeout(() => this.playZenNote(), nextInterval);
            }
            start() {
                this.init();
                if (this.isPlaying) return;
                this.isPlaying = true;
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.masterGain.gain.setValueAtTime(this.volume * this.duckFactor, this.ctx.currentTime);
                }
                this.startDrone();
                this.playZenNote();
            }
            stop() {
                this.isPlaying = false;
                if (this.timer) clearTimeout(this.timer);
                this.stopDrone();
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.masterGain.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + 0.3);
                }
            }
        }

                clean = clean.replace(/[*#_~`>]/g, "");         // 移除 *、#、> 等符號

                // 5. 優化條列標號（將 1. 2. 轉為 ✦ 莊重印章符號，直書排版更和諧）
                clean = clean.replace(/^(\d+)\.\s*/gm, "✦ ");

                // 6. 整理空行，避免過多空隙
                clean = clean.split('\n').map(l => l.trim()).filter(Boolean).join('\n\n');

                return clean.trim();

                                                    key={q}

                                                </div>
                                            )}
                                        </div>

                                </div>
                            </div>
                        </div>

                                                ? 'bg-rose-500/80 hover:bg-rose-600 text-white' 
                                                : 'bg-amber-500 hover:bg-amber-400 text-slate-950'

                                                <Icon name="play" className="w-3.5 h-3.5 fill-current" />

                        {showTalisman && <TalismanModal text={talismanText} onClose={() => setShowTalisman(false)} />}
                        {showIChing && <IChingModal onClose={() => setShowIChing(false)} />}

                                                            <span className="flex items-center gap-1">MA10: {stockChartData.indicators.ma10} ({stockChartData.indicators.ma10_trend === 'up' ? '↗ 向上' : '↘ 向下'}) - {stockChartData.indicators.price_above_ma10 ? <span className="text-rose-600">站上線</span> : <span className="text-emerald-600">跌破線</span>}</span>
                                                            <span className="flex items-center gap-1">BBI均衡: {stockChartData.indicators.bbi} (趨勢 {stockChartData.indicators.bbi_trend === 'up' ? '↗' : '↘'})</span>
                                                            <span className="flex items-center gap-1">量能感應: {stockChartData.indicators.vol_status} (量比 {stockChartData.indicators.vol_ratio})</span>
                                                        </span>
                                                    ) : "正在結合均線與成交量能進行天機運算..."}
                                                </p>
                                            </div>
                                            <div className="p-5 bg-indigo-50/50 rounded-3xl border border-indigo-100/50 text-indigo-900">
                                                <h4 className="text-sm font-black mb-2 flex items-center gap-2">
                                                    <Icon name="atom" className="w-4 h-4" /> 紫微命理合參
                                                </h4>
                                                <p className="text-xs opacity-80 leading-relaxed font-bold">
                                                    結合緣主【{bureau}】氣場，本標的之金流屬性與您的財帛宮位相位正在進行同步共振。
                                                </p>
                                            </div>
                                        </div>

                                        {/* Real-time Current Events & Sentiment Card */}
                                        {stockChartData.news && stockChartData.news.length > 0 && (
                                            <div className="mt-4 p-5 bg-gradient-to-br from-amber-500/10 via-orange-500/5 to-transparent rounded-3xl border border-amber-200/60 shadow-sm">
                                                <div className="flex items-center justify-between mb-3">
                                                    <h4 className="text-sm font-black text-amber-900 flex items-center gap-2">
                                                        <Icon name="newspaper" className="w-4 h-4 text-amber-600" />
                                                        即時財經時事情報 · 多空輿情解碼
                                                    </h4>
                                                    <span className="text-[10px] font-bold px-2.5 py-0.5 bg-amber-100/80 text-amber-800 rounded-full border border-amber-200/50">
                                                        即時快訊
                                                    </span>
                                                </div>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                                                    {stockChartData.news.map((item, idx) => (
                                                        <a 
                                                            key={idx} 
                                                            href={item.link || "#"} 
                                                            target="_blank" 
                                                            rel="noopener noreferrer"
                                                            className="flex items-start justify-between gap-2.5 p-3 rounded-2xl bg-white/80 hover:bg-white transition-all border border-amber-100/60 hover:border-amber-300 shadow-sm hover:shadow group"
                                                        >
                                                            <div className="flex items-start gap-2 min-w-0">
                                                                <span className="text-xs shrink-0 mt-0.5 font-bold">
                                                                    {item.sentiment === 'bullish' ? '🟢' : (item.sentiment === 'bearish' ? '🔴' : '⚪')}
                                                                </span>
                                                                <div className="min-w-0">
                                                                    <p className="text-xs font-bold text-slate-800 group-hover:text-indigo-600 truncate transition-colors">
                                                                        {item.title}
                                                                    </p>
                                                                    <p className="text-[10px] text-slate-400 font-medium mt-0.5">
                                                                        {item.publisher} · {item.date}
                                                                    </p>
                                                                </div>
                                                            </div>
                                                            <span className={`text-[10px] font-black shrink-0 px-2 py-0.5 rounded-full ${
                                                                item.sentiment === 'bullish' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                                                                (item.sentiment === 'bearish' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-slate-100 text-slate-600 border border-slate-200')
                                                            }`}>
                                                                {item.sentiment_zh}
                                                            </span>
                                                        </a>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* Master's Analysis Section inside Modal */}
                                        <div className="mt-6 p-6 bg-gradient-to-br from-indigo-900 via-slate-900 to-purple-900 rounded-[2rem] border border-white/20 shadow-2xl relative overflow-hidden group">
                                            {/* Aura background for analysis */}
                                            <div className="absolute top-0 right-0 w-32 h-32 bg-purple-500/20 rounded-full blur-3xl group-hover:bg-purple-500/30 transition-all"></div>
                                            <div className="absolute bottom-0 left-0 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl group-hover:bg-indigo-500/30 transition-all"></div>

                                            <div className="relative z-10">
                                                <h4 className="text-lg font-black text-white mb-4 flex items-center gap-3">
                                                    <div className="p-2 bg-white/10 rounded-lg">
                                                        <Icon name="sparkles" className="w-5 h-5 text-amber-400" />
                                                    </div>
                                                    大師天機感應 · 股市詳評
                                                </h4>
                                                <div className="text-sm text-indigo-50 leading-loose font-bold whitespace-pre-wrap bg-white/5 p-5 rounded-2xl border border-white/5 backdrop-blur-sm min-h-[150px]">
                                                    {stockAnalysis || "（正在等待天機降臨...）"}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="p-6 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                                        <p className="text-[10px] text-slate-400 font-black uppercase tracking-wider">※ 預測僅供參考，天機不可洩漏過度，投資請謹慎。</p>
                                        <div className="flex gap-2 text-xs font-black text-indigo-600">
                                            <span>歷史數據由 YFinance 提供</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Floating Chart Toggle Button */}
                        {stockChartData && !showStockModal && (
                            <div className="fixed bottom-6 right-20 z-50 animate-bounce scroll-mt-20">
                                <button onClick={toggleStockModal} className="w-14 h-14 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-700 text-white shadow-2xl hover:scale-110 transition-all flex items-center justify-center ring-4 ring-white/30 group" title="開啟最近一次股市圖表">
                                    <Icon name="line-chart" className="w-6 h-6 group-hover:rotate-12 transition-transform" />
                                    <div className="absolute -top-1 -right-1 bg-red-500 text-[8px] px-1.5 py-0.5 rounded-full border border-white font-black animate-pulse">ON</div>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // initIcons removed
    </script>
</body>

</html>
